services:
  backend-service:
    container_name: backend-container
    build:
      context: .
      dockerfile: docker/laravel/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend-app:/var/www/html
      - backend_data:/var/www/html/vendor
      - ./docker/laravel/entrypoint.development.sh:/usr/local/bin/entrypoint.development.sh
    ports:
      - "8000:8000"
    depends_on:
      - mysql-service
    command: ["bash", "/usr/local/bin/entrypoint.development.sh"]

  frontend-service:
    container_name: frontend-container
    build:
      context: .
      dockerfile: docker/vuejs/Dockerfile
    working_dir: /app
    volumes:
      - ./frontend-app:/app
      - frontend_data:/var/www/html/node_modules
      - ./docker/vuejs/entrypoint.development.sh:/usr/local/bin/entrypoint.development.sh
    ports:
      - "5173:5173"
    depends_on:
      - backend-service
    command: ["sh", "/usr/local/bin/entrypoint.development.sh"]

  mysql-service:
    image: mysql:8.0
    container_name: Mysql-container
    environment:
      MYSQL_DATABASE: tour_booking
      MYSQL_USER: tour_user
      MYSQL_PASSWORD: tour_password
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2.2
    container_name: Phpmyadmin-container
    depends_on:
      - mysql-service
    environment:
      UPLOAD_LIMIT: 50M
      PMA_HOST: mysql-service
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "9000:80"

volumes:
  mysql_data:
  frontend_data:
  backend_data:
